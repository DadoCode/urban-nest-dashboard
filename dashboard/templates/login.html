<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — Urban Nest Estates</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
</head>
<body>
  <main class="login">
    <div class="login-box">
      <div class="brand-row"><div class="mark">UN</div><div><strong>Urban Nest</strong><div class="note">Estates</div></div></div>
      <h1 style="font-size:22px; margin-top:var(--s5)">Sign in</h1>
      <p class="subtitle" style="margin-bottom:var(--s4)">Enter the password you were given to view the dashboard.</p>
      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password" style="width:100%; height:38px; margin-bottom:var(--s3)">
        <button type="submit" style="width:100%; height:38px">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
